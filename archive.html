<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>쿼터다이어리 - 보관함</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230c0e10'/%3E%3Crect x='24' y='20' width='52' height='60' rx='4' fill='%23fefefe'/%3E%3Crect x='30' y='26' width='40' height='38' rx='2' fill='%238fc9bc'/%3E%3Ccircle cx='50' cy='45' r='9' fill='%230c0e10' opacity='.35'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquareNeo@1.0/nanumsquareneo.css" rel="stylesheet">
<!-- 공통 코드. 고칠 때마다 ?v= 숫자를 올린다 — 안 올리면 브라우저가 옛 파일을 계속 쓴다 -->
<script src="shared.js?v=2"></script>
<style>
:root{
  --mint:#8fc9bc; --mint-ink:#2f8f78; --mint-soft:#bfe0d7;
  --void:#0c0e10; --panel:#15181b; --line:#2a2e31;
  --ink:#ece8e0; --ink-soft:#9a938a; --ink-faint:#6b6258;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;}
body{font-family:'NanumSquareNeo','Helvetica Neue',-apple-system,'Apple SD Gothic Neo',sans-serif;
  background:radial-gradient(120% 78% at 50% 0%, #15181b 0%, #0c0e10 60%);
  color:var(--ink);min-height:100dvh;
  padding:max(30px,env(safe-area-inset-top)) 22px calc(56px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;
  /* 한글은 단어 중간에서 끊기지 않게, 긴 영문 주소만 필요할 때 끊는다 */
  word-break:keep-all;overflow-wrap:anywhere;}
.wrap{width:100%;max-width:760px;}

.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.4em;text-transform:uppercase;color:#a49c90;}
.eyebrow b{color:var(--mint);font-weight:800;}
h1{font-size:26px;font-weight:800;line-height:1.42;letter-spacing:-.01em;margin-top:16px;}
h1 em{display:block;font-style:normal;font-size:13px;font-weight:700;color:var(--mint);
  letter-spacing:.02em;margin-bottom:9px;}
.lead{font-size:13.5px;line-height:1.75;color:var(--ink-soft);margin-top:12px;}

/* 섹션 제목 — 한글이라 자간을 벌리지 않는다(벌리면 '분 기 별'처럼 흩어져 보인다) */
h2{font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--ink);
  margin:48px 0 16px;padding-bottom:11px;border-bottom:1px solid var(--line);}

/* ---- 분기 카드 ---- */
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px;}
.q{display:block;text-decoration:none;color:inherit;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:16px 16px 14px;
  transition:border-color .18s,transform .18s;}
.q:hover{border-color:rgba(143,201,188,.5);transform:translateY(-2px);}
.q .qh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.q .qn{font-size:16px;font-weight:800;letter-spacing:-.01em;}
.q .qb{font-size:9.5px;font-weight:800;letter-spacing:.16em;color:var(--mint);
  border:1px solid rgba(143,201,188,.35);border-radius:2px;padding:4px 7px;white-space:nowrap;}
.q .qm{font-size:11.5px;color:var(--ink-faint);margin-top:7px;letter-spacing:.02em;}
.strip{display:flex;gap:4px;margin-top:13px;}
.strip i{display:block;width:100%;aspect-ratio:4/5;border-radius:2px;background-size:cover;
  background-position:center;background-color:#1d2124;}
.strip .more{display:flex;align-items:center;justify-content:center;font-style:normal;
  font-size:10.5px;font-weight:700;color:var(--ink-faint);background:#1d2124;}
.q .go{font-size:11.5px;font-weight:700;color:var(--mint);margin-top:13px;letter-spacing:.02em;}
.q.empty{opacity:.5;}
.q.empty .go{color:var(--ink-faint);}

/* ---- 사람별 ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
.chip{font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink-soft);
  background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;
  cursor:pointer;transition:all .16s;}
.chip:hover{color:var(--ink);border-color:#3c4145;}
.chip.on{color:var(--void);background:var(--mint);border-color:var(--mint);}

.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;}
.shot{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.shot .ph{width:100%;aspect-ratio:4/5;background-size:cover;background-position:center;
  background-color:#1d2124;display:block;}
.shot .tx{padding:11px 12px 13px;}
.shot .qq{font-size:9.5px;font-weight:800;letter-spacing:.16em;color:var(--mint);}
.shot .tt{font-size:13px;font-weight:700;line-height:1.5;margin-top:5px;
  overflow-wrap:anywhere;}
.shot .yt{display:inline-block;font-size:11px;color:var(--ink-faint);margin-top:8px;
  text-decoration:none;border-bottom:1px solid #34393d;padding-bottom:1px;}
.shot .yt:hover{color:var(--mint);border-color:var(--mint);}

.note{font-size:12.5px;color:var(--ink-faint);line-height:1.8;padding:22px 0;}
.foot{margin-top:52px;text-align:center;font-size:9.5px;font-weight:800;letter-spacing:.4em;
  text-transform:uppercase;color:#3e3933;}
</style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow">Quarter Diary</div>
  <h1><em id="range">보관함</em>지나온 분기를<br>다시 꺼내 봅니다.</h1>
  <p class="lead">분기를 고르면 그때 그 발표를 그대로 다시 재생합니다.<br>아래에서는 한 사람이 분기마다 남긴 장면을 이어서 볼 수 있어요.</p>

  <h2>분기별</h2>
  <div class="qs" id="quarters"><div class="note">불러오는 중…</div></div>

  <h2>사람별</h2>
  <div class="chips" id="chips"></div>
  <div class="shots" id="shots"></div>
  <div class="note" id="shotsNote" style="display:none"></div>

  <div class="foot">기획자의 독서</div>
</main>

<script>
/* =========================================================================
   보관함
   - quarters 목록 + 각 분기의 사진 수/썸네일 → 누르면 wall.html?y=&q= 로 재생
   - 사람별 보기: 한 멤버가 분기마다 남긴 장면을 이어서
   연결·조회는 shared.js 가 맡는다.
   ========================================================================= */
const TABLE = "wall";

let ROWS = [];      // 전체 사진 (숨김 제외, 분기별 최신 1장으로 추린 것)
let QUARTERS = [];
let MEMBERS = [];

const elQuarters = document.getElementById('quarters');
const elChips    = document.getElementById('chips');
const elShots    = document.getElementById('shots');
const elNote     = document.getElementById('shotsNote');

function qKey(r){ return r.year + '-' + r.quarter; }

// 같은 사람이 한 분기에 여러 번 올렸으면 가장 최근 1장만 (발표 화면과 같은 규칙)
function newestPerMemberPerQuarter(rows){
  const m = new Map();
  rows.forEach((r,i)=>{
    const who = r.member_id || (r.name||'').trim() || ('__blank'+i);
    const key = qKey(r) + '|' + who;
    const prev = m.get(key);
    if(!prev || new Date(r.created_at||0) > new Date(prev.created_at||0)) m.set(key, r);
  });
  return [...m.values()];
}

function thumb(url){ return url ? "url('" + String(url).replace(/['"\\]/g,'') + "')" : ''; }

/* ---- 분기 카드 ---- */
function renderQuarters(){
  elQuarters.innerHTML = '';
  if(!QUARTERS.length){
    elQuarters.innerHTML = '<div class="note">아직 만들어진 분기가 없어요.</div>';
    return;
  }
  QUARTERS.forEach(q=>{
    const shots = ROWS.filter(r=>r.year===q.year && r.quarter===q.quarter);
    const a = document.createElement(shots.length ? 'a' : 'div');
    a.className = 'q' + (shots.length ? '' : ' empty');
    if(shots.length) a.href = 'wall.html?y=' + q.year + '&q=' + q.quarter;

    const strip = shots.slice(0,4).map(r=>
      '<i style="background-image:' + thumb(r.url) + '"></i>').join('');
    const more = shots.length > 4
      ? '<i class="more">+' + (shots.length - 4) + '</i>' : '';

    a.innerHTML =
      '<div class="qh"><span class="qn">' + q.label + '</span>' +
      '<span class="qb">Q' + q.quarter + '</span></div>' +
      '<div class="qm">' + (shots.length ? shots.length + '명이 남겼어요' : '아직 사진이 없어요') +
        (q.upload_open ? ' · 제출 받는 중' : '') + '</div>' +
      (shots.length ? '<div class="strip">' + strip + more + '</div>' : '') +
      '<div class="go">' + (shots.length ? '발표 다시보기 →' : '준비 중') + '</div>';
    elQuarters.appendChild(a);
  });
}

/* ---- 사람별 ---- */
function renderChips(){
  elChips.innerHTML = '';
  // 사진을 한 장이라도 남긴 사람만 보여준다
  const has = new Set(ROWS.map(r=>r.member_id).filter(Boolean));
  const list = MEMBERS.filter(m=>has.has(m.id));
  if(!list.length){
    elNote.style.display=''; elNote.textContent='아직 사람별로 볼 기록이 없어요.';
    return;
  }
  list.forEach((m,i)=>{
    const b=document.createElement('button');
    b.type='button'; b.className='chip'+(i===0?' on':''); b.textContent=m.name;
    b.onclick=()=>{
      [...elChips.children].forEach(c=>c.classList.remove('on'));
      b.classList.add('on');
      renderShots(m.id);
    };
    elChips.appendChild(b);
  });
  renderShots(list[0].id);
}

function renderShots(memberId){
  const mine = ROWS.filter(r=>r.member_id===memberId)
    .sort((a,b)=> (a.year-b.year) || (a.quarter-b.quarter));
  elShots.innerHTML='';
  if(!mine.length){
    elNote.style.display=''; elNote.textContent='이 분은 아직 남긴 장면이 없어요.';
    return;
  }
  elNote.style.display='none';
  mine.forEach(r=>{
    const d=document.createElement('div'); d.className='shot';
    const yt = r.music
      ? '<a class="yt" href="'+String(r.music).replace(/"/g,'&quot;')+'" target="_blank" rel="noopener">음악 들으러 가기 →</a>'
      : '';
    d.innerHTML =
      '<span class="ph" style="background-image:'+thumb(r.url)+'"></span>' +
      '<div class="tx"><div class="qq">'+r.year+' · Q'+r.quarter+'</div>' +
      '<div class="tt">'+ (r.title||'제목 없음') +'</div>' + yt + '</div>';
    elShots.appendChild(d);
  });
}

async function start(){
  QD.nav('archive');
  try{
    const sb = await QD.sb();
    const [qs, ms, res] = await Promise.all([
      QD.listQuarters(),
      QD.listMembers({activeOnly:false}),   // 지금은 안 나오는 분도 지난 기록은 보여야 한다
      sb.from(TABLE).select('*').neq('quarter', 9).limit(500)
    ]);
    if(res.error) throw res.error;
    QUARTERS = qs;
    MEMBERS  = ms;
    ROWS     = newestPerMemberPerQuarter((res.data||[]).filter(r=>!r.hidden));

    const years=[...new Set(QUARTERS.map(q=>q.year))].sort();
    document.getElementById('range').textContent =
      years.length ? (years.length===1 ? years[0]+'년' : years[0]+'–'+years[years.length-1]+'년') : '보관함';

    renderQuarters();
    renderChips();
  }catch(e){
    console.error(e);
    elQuarters.innerHTML='<div class="note">불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 해주세요.</div>';
  }
}
start();
</script>
</body>
</html>
